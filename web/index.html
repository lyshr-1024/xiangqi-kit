<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋</title>
<style>
:root {
  --paper: #ede3cd;
  --paper-deep: #e2d4b6;
  --ink: #2b2620;
  --ink-soft: #6b6355;
  --cinnabar: #a63a2a;
  --cinnabar-deep: #8c2f22;
  --ivory: #f8f0dd;
  --wood-hi: #d9b98c;
  --wood-lo: #c6a06b;
  --wood-frame: #7d5633;
  --line: #6b4a26;
  --jade: #3f7f6e;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", var(--serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--serif);
  color: var(--ink);
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255, 252, 242, .65), rgba(255, 252, 242, 0) 60%),
    linear-gradient(180deg, var(--paper), var(--paper-deep));
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 16px 40px;
}
.app-header {
  width: min(1060px, 100%);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px 24px;
  padding-bottom: 18px;
}
h1 {
  font-size: 2.1rem;
  font-weight: 700;
  letter-spacing: .35em;
  text-indent: .1em;
}
h1 .sub {
  font-size: .72rem;
  letter-spacing: .5em;
  color: var(--ink-soft);
  margin-left: 1.2em;
  vertical-align: .35em;
}
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.controls label { font-size: .85rem; color: var(--ink-soft); letter-spacing: .12em; }
select, button {
  font-family: var(--serif);
  font-size: .9rem;
  color: var(--ink);
  background: var(--ivory);
  border: 1px solid #c9b489;
  border-radius: 6px;
  padding: 7px 12px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .1s;
}
select:hover, button:hover { border-color: var(--wood-frame); }
button:active { transform: translateY(1px); }
button.primary { background: var(--cinnabar); border-color: var(--cinnabar-deep); color: var(--ivory); }
button.primary:hover { background: var(--cinnabar-deep); }
main {
  width: min(1060px, 100%);
  display: flex;
  gap: 26px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}
.board-wrap {
  /* 宽度同时受容器与视口高度约束，保证棋盘不出首屏（580/640 ≈ 0.906） */
  flex: 0 1 min(620px, calc((100vh - 200px) * 0.906));
  min-width: 300px;
  filter: drop-shadow(0 18px 30px rgba(60, 40, 15, .28));
}
#board { width: 100%; height: auto; display: block; border-radius: 10px; }
.panel {
  flex: 1 1 300px;
  min-width: 260px;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.status {
  background: var(--ivory);
  border: 1px solid #d5c49d;
  border-left: 4px solid var(--cinnabar);
  border-radius: 8px;
  padding: 13px 16px;
  font-size: 1rem;
  letter-spacing: .1em;
  min-height: 3em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.status.black-turn { border-left-color: var(--ink); }
.status.over { border-left-color: var(--jade); font-weight: 700; }
.spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(43, 38, 32, .2);
  border-top-color: var(--cinnabar);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.record {
  background: var(--ivory);
  border: 1px solid #d5c49d;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.record h2 {
  font-size: .82rem;
  letter-spacing: .4em;
  color: var(--ink-soft);
  font-weight: 400;
  padding: 10px 16px 8px;
  border-bottom: 1px solid #e3d6b4;
}
#movelist {
  list-style: none;
  overflow-y: auto;
  max-height: 430px;
  padding: 6px 0;
  font-size: .95rem;
}
#movelist li {
  display: grid;
  grid-template-columns: 3em 1fr 1fr;
  align-items: center;
  padding: 0 14px;
}
#movelist .no { color: var(--ink-soft); font-size: .8rem; text-align: right; padding-right: .8em; }
#movelist .ply {
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: .08em;
  transition: background .12s;
}
#movelist .ply:hover { background: rgba(166, 58, 42, .09); }
#movelist .ply.current { background: rgba(166, 58, 42, .16); font-weight: 700; }
#movelist .empty { grid-column: 1 / -1; color: var(--ink-soft); text-align: center; padding: 18px 0; font-size: .85rem; letter-spacing: .2em; }
#tohead { align-self: center; margin: 4px 0 10px; font-size: .82rem; padding: 5px 14px; }
footer { margin-top: 26px; font-size: .75rem; color: var(--ink-soft); letter-spacing: .25em; }

/* SVG 内元素 */
.piece { cursor: pointer; transition: transform .18s ease-out; }
.piece circle.body { transition: filter .15s; }
.piece:hover circle.body { filter: brightness(1.05); }
.piece text {
  font-family: var(--kai);
  font-size: 30px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  user-select: none;
}
.piece.dead { display: none; }
.piece.selected circle.ring { stroke: var(--jade); stroke-width: 2.5; }
.piece.in-check circle.body { animation: checkpulse .9s ease-in-out infinite; }
@keyframes checkpulse {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 7px rgba(166, 58, 42, .95)) brightness(1.08); }
}
.dot { fill: var(--jade); opacity: .55; cursor: pointer; transition: opacity .12s; }
.dot:hover { opacity: .95; }
.capture-ring { fill: none; stroke: var(--jade); stroke-width: 2.5; stroke-dasharray: 5 4; opacity: .8; cursor: pointer; }
.lastmove { fill: none; stroke: rgba(166, 58, 42, .55); stroke-width: 2; }
.board-label { font-family: var(--serif); font-size: 15px; fill: rgba(80, 55, 25, .75); text-anchor: middle; }
.river-text {
  font-family: var(--kai);
  font-size: 30px;
  fill: rgba(90, 62, 28, .38);
  text-anchor: middle;
  letter-spacing: .5em;
}
@media (max-width: 720px) {
  h1 { font-size: 1.5rem; }
  #movelist { max-height: 220px; }
}
</style>
</head>
<body>
<header class="app-header">
  <h1>象棋<span class="sub">XIANGQI</span></h1>
  <div class="controls">
    <label>难度
      <select id="difficulty">
        <option value="easy">入门</option>
        <option value="normal" selected>普通</option>
        <option value="strong">较强</option>
      </select>
    </label>
    <label>执子
      <select id="mode">
        <option value="red" selected>执红对 AI</option>
        <option value="black">执黑对 AI</option>
        <option value="both">双人对弈</option>
      </select>
    </label>
    <button id="undo">悔棋</button>
    <button id="new" class="primary">新对局</button>
  </div>
</header>
<main>
  <div class="board-wrap"><svg id="board" viewBox="0 0 580 640" aria-label="棋盘"></svg></div>
  <aside class="panel">
    <div id="status" class="status">轮到红方</div>
    <div class="record">
      <h2>棋谱</h2>
      <ol id="movelist"></ol>
      <button id="tohead" hidden>回到最新</button>
    </div>
  </aside>
</main>
<footer>本地引擎 · 零依赖 · 可离线</footer>
<!-- 引擎块：主线程、Web Worker（经 textContent 提取）、Node perft 测试三方共用 -->
<script id="engine">
"use strict";
const XQ = (() => {
  const RED = "w", BLACK = "b";
  const START_FEN = "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1";
  const PIECES = new Set("rnbakcpRNBAKCP");
  const ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  const HORSE = [[-2, -1], [-2, 1], [2, -1], [2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2]];
  const ELEPHANT = [[-2, -2], [-2, 2], [2, -2], [2, 2]];

  const isRedPiece = (pc) => pc !== "." && pc === pc.toUpperCase();
  const inPalace = (r, c, red) => c >= 3 && c <= 5 && (red ? r >= 7 : r <= 2);
  // 走法编码为整数 from*90+to
  const mv = (frm, to) => frm * 90 + to;
  const mvFrom = (m) => (m / 90) | 0;
  const mvTo = (m) => m % 90;

  class Position {
    constructor(board, sideToMove = RED, halfmoveClock = 0, fullmoveNumber = 1) {
      this.board = board;
      this.sideToMove = sideToMove;
      this.halfmoveClock = halfmoveClock;
      this.fullmoveNumber = fullmoveNumber;
    }

    static fromFen(fen) {
      const fields = fen.trim().split(/\s+/);
      if (fields.length < 2) throw new Error(`FEN 字段不足: ${fen}`);
      const rows = fields[0].split("/");
      if (rows.length !== 10) throw new Error(`FEN 应有 10 行: ${fen}`);
      const board = [];
      for (const row of rows) {
        const cols = [];
        for (const ch of row) {
          if (ch >= "1" && ch <= "9") for (let i = 0; i < Number(ch); i++) cols.push(".");
          else if (PIECES.has(ch)) cols.push(ch);
          else throw new Error(`FEN 含非法字符 ${ch}`);
        }
        if (cols.length !== 9) throw new Error(`FEN 行宽应为 9: ${row}`);
        board.push(...cols);
      }
      const side = fields[1];
      if (side !== RED && side !== BLACK) throw new Error(`走子方应为 w/b: ${side}`);
      return new Position(board, side, Number(fields[4] ?? 0), Number(fields[5] ?? 1));
    }

    toFen() {
      const rows = [];
      for (let r = 0; r < 10; r++) {
        let row = "", empty = 0;
        for (let c = 0; c < 9; c++) {
          const pc = this.board[r * 9 + c];
          if (pc === ".") empty += 1;
          else {
            if (empty) { row += empty; empty = 0; }
            row += pc;
          }
        }
        if (empty) row += empty;
        rows.push(row);
      }
      return `${rows.join("/")} ${this.sideToMove} - - ${this.halfmoveClock} ${this.fullmoveNumber}`;
    }

    makeMove(m) {
      const frm = mvFrom(m), to = mvTo(m);
      const piece = this.board[frm], captured = this.board[to];
      const undo = [frm, to, piece, captured, this.halfmoveClock];
      this.board[to] = piece;
      this.board[frm] = ".";
      this.halfmoveClock = captured !== "." ? 0 : this.halfmoveClock + 1;
      if (this.sideToMove === BLACK) this.fullmoveNumber += 1;
      this.sideToMove = this.sideToMove === RED ? BLACK : RED;
      return undo;
    }

    unmakeMove(undo) {
      const [frm, to, piece, captured, halfmove] = undo;
      this.board[frm] = piece;
      this.board[to] = captured;
      this.halfmoveClock = halfmove;
      this.sideToMove = this.sideToMove === RED ? BLACK : RED;
      if (this.sideToMove === BLACK) this.fullmoveNumber -= 1;
    }

    inCheck(side = null) {
      side = side || this.sideToMove;
      const board = this.board;
      const red = side === RED;
      const ks = board.indexOf(red ? "K" : "k");
      const kr = (ks / 9) | 0, kc = ks % 9;
      const eRook = red ? "r" : "R", eCannon = red ? "c" : "C", eKing = red ? "k" : "K";
      const eHorse = red ? "n" : "N", ePawn = red ? "p" : "P";

      // 车/炮/照面：沿直线扫描；仕相够不到对方九宫，无需检查
      for (const [dr, dc] of ORTHO) {
        let r = kr + dr, c = kc + dc, behindScreen = false;
        while (r >= 0 && r < 10 && c >= 0 && c < 9) {
          const pc = board[r * 9 + c];
          if (pc !== ".") {
            if (!behindScreen) {
              if (pc === eRook || pc === eKing) return true;
              behindScreen = true;
            } else {
              if (pc === eCannon) return true;
              break;
            }
          }
          r += dr; c += dc;
        }
      }
      for (const [dr, dc] of HORSE) {
        const r = kr + dr, c = kc + dc;
        if (r >= 0 && r < 10 && c >= 0 && c < 9 && board[r * 9 + c] === eHorse) {
          const lr = kr + (dr > 0 ? 1 : -1), lc = kc + (dc > 0 ? 1 : -1);
          if (board[lr * 9 + lc] === ".") return true;
        }
      }
      const eFwd = red ? 1 : -1;
      const pr = kr - eFwd;
      if (pr >= 0 && pr < 10 && board[pr * 9 + kc] === ePawn) return true;
      const enemyCrossed = red ? kr >= 5 : kr <= 4;
      if (enemyCrossed) {
        for (const dc of [-1, 1]) {
          const c = kc + dc;
          if (c >= 0 && c < 9 && board[kr * 9 + c] === ePawn) return true;
        }
      }
      return false;
    }

    pseudoMoves() {
      const board = this.board;
      const red = this.sideToMove === RED;
      const moves = [];
      const push = (s, nr, nc) => moves.push(mv(s, nr * 9 + nc));
      for (let s = 0; s < 90; s++) {
        const pc = board[s];
        if (pc === "." || isRedPiece(pc) !== red) continue;
        const r = (s / 9) | 0, c = s % 9;
        const kind = pc.toUpperCase();
        if (kind === "R") {
          for (const [dr, dc] of ORTHO) {
            let nr = r + dr, nc = c + dc;
            while (nr >= 0 && nr < 10 && nc >= 0 && nc < 9) {
              const target = board[nr * 9 + nc];
              if (target === ".") push(s, nr, nc);
              else {
                if (isRedPiece(target) !== red) push(s, nr, nc);
                break;
              }
              nr += dr; nc += dc;
            }
          }
        } else if (kind === "C") {
          for (const [dr, dc] of ORTHO) {
            let nr = r + dr, nc = c + dc;
            while (nr >= 0 && nr < 10 && nc >= 0 && nc < 9) {
              if (board[nr * 9 + nc] !== ".") break;
              push(s, nr, nc);
              nr += dr; nc += dc;
            }
            nr += dr; nc += dc;
            while (nr >= 0 && nr < 10 && nc >= 0 && nc < 9) {
              const target = board[nr * 9 + nc];
              if (target !== ".") {
                if (isRedPiece(target) !== red) push(s, nr, nc);
                break;
              }
              nr += dr; nc += dc;
            }
          }
        } else if (kind === "N") {
          for (const [dr, dc] of HORSE) {
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= 10 || nc < 0 || nc >= 9) continue;
            const lr = r + (Math.abs(dr) === 2 ? dr / 2 : 0);
            const lc = c + (Math.abs(dc) === 2 ? dc / 2 : 0);
            if (board[lr * 9 + lc] !== ".") continue;
            const target = board[nr * 9 + nc];
            if (target === "." || isRedPiece(target) !== red) push(s, nr, nc);
          }
        } else if (kind === "B") {
          for (const [dr, dc] of ELEPHANT) {
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= 10 || nc < 0 || nc >= 9) continue;
            if (red ? nr < 5 : nr > 4) continue;
            if (board[(r + dr / 2) * 9 + (c + dc / 2)] !== ".") continue;
            const target = board[nr * 9 + nc];
            if (target === "." || isRedPiece(target) !== red) push(s, nr, nc);
          }
        } else if (kind === "A") {
          for (const [dr, dc] of DIAG) {
            const nr = r + dr, nc = c + dc;
            if (!inPalace(nr, nc, red) || nr < 0 || nr >= 10) continue;
            const target = board[nr * 9 + nc];
            if (target === "." || isRedPiece(target) !== red) push(s, nr, nc);
          }
        } else if (kind === "K") {
          for (const [dr, dc] of ORTHO) {
            const nr = r + dr, nc = c + dc;
            if (!inPalace(nr, nc, red) || nr < 0 || nr >= 10) continue;
            const target = board[nr * 9 + nc];
            if (target === "." || isRedPiece(target) !== red) push(s, nr, nc);
          }
        } else if (kind === "P") {
          const fwd = red ? -1 : 1;
          const nr = r + fwd;
          if (nr >= 0 && nr < 10) {
            const target = board[nr * 9 + c];
            if (target === "." || isRedPiece(target) !== red) push(s, nr, c);
          }
          const crossed = red ? r <= 4 : r >= 5;
          if (crossed) {
            for (const dc of [-1, 1]) {
              const nc = c + dc;
              if (nc >= 0 && nc < 9) {
                const target = board[r * 9 + nc];
                if (target === "." || isRedPiece(target) !== red) push(s, r, nc);
              }
            }
          }
        }
      }
      return moves;
    }

    legalMoves() {
      const us = this.sideToMove;
      const moves = [];
      for (const m of this.pseudoMoves()) {
        const undo = this.makeMove(m);
        if (!this.inCheck(us)) moves.push(m);
        this.unmakeMove(undo);
      }
      return moves;
    }

    isCheckmate() { return this.inCheck() && this.legalMoves().length === 0; }
    isStalemate() { return !this.inCheck() && this.legalMoves().length === 0; }
  }

  function perft(pos, depth) {
    if (depth === 0) return 1;
    const moves = pos.legalMoves();
    if (depth === 1) return moves.length;
    let total = 0;
    for (const m of moves) {
      const undo = pos.makeMove(m);
      total += perft(pos, depth - 1);
      pos.unmakeMove(undo);
    }
    return total;
  }

  // ---- 中文记谱（生成方向；红汉字、黑阿拉伯，前/后/中标记同 Python 实现）----
  const HAN = "一二三四五六七八九";
  const RED_NAMES = { R: "车", N: "马", C: "炮", P: "兵", K: "帅", A: "仕", B: "相" };
  const BLACK_NAMES = { r: "车", n: "马", c: "炮", p: "卒", k: "将", a: "士", b: "象" };
  const fileChar = (col, red) => (red ? HAN[8 - col] : String(col + 1));
  const numChar = (n, red) => (red ? HAN[n - 1] : String(n));
  const markers = (n) => {
    if (n === 2) return ["前", "后"];
    if (n === 3) return ["前", "中", "后"];
    const mid = [];
    for (let i = 1; i < n - 1; i++) mid.push(HAN[i]);
    return ["前", ...mid, "后"];
  };

  function notate(pos, m, fileMarker = false) {
    const board = pos.board;
    const frm = mvFrom(m), to = mvTo(m);
    const pc = board[frm];
    const red = isRedPiece(pc);
    const r = (frm / 9) | 0, c = frm % 9;
    const nr = (to / 9) | 0, nc = to % 9;
    const name = (red ? RED_NAMES : BLACK_NAMES)[pc];

    let marker = "";
    if ("RNCP".includes(pc.toUpperCase())) {
      const rows = [];
      for (let r2 = 0; r2 < 10; r2++) if (board[r2 * 9 + c] === pc) rows.push(r2);
      if (rows.length > 1) {
        if (!red) rows.reverse(); // 排头 = 靠近敌方
        marker = markers(rows.length)[rows.indexOf(r)];
      }
    }
    const prefix = marker ? marker + (fileMarker ? fileChar(c, red) : name) : name + fileChar(c, red);
    if (nr === r) return prefix + "平" + fileChar(nc, red);
    const forward = red ? nr < r : nr > r;
    const verb = forward ? "进" : "退";
    if ("RCKP".includes(pc.toUpperCase())) return prefix + verb + numChar(Math.abs(nr - r), red);
    return prefix + verb + fileChar(nc, red);
  }

  function notationMap(pos) {
    const result = new Map();
    const counts = new Map();
    for (const m of pos.legalMoves()) {
      const text = notate(pos, m);
      result.set(m, text);
      counts.set(text, (counts.get(text) ?? 0) + 1);
    }
    for (const [m, text] of result) {
      if (counts.get(text) > 1) result.set(m, notate(pos, m, true));
    }
    return result;
  }

  const toNotation = (pos, m) => notationMap(pos).get(m);

  // ---- 估值与搜索（与 Python 版同构）----
  const MATE = 100000;
  const VALUES = { R: 900, N: 400, C: 450, P: 100, A: 200, B: 200, K: 0 };
  // 各兵种按行的位置分（红方视角，row 0 = 黑方底线），列上叠加中心奖励
  const ROW_BONUS = {
    N: [4, 12, 18, 16, 14, 10, 6, 4, 2, 0],
    R: [14, 18, 12, 10, 12, 12, 6, 4, 4, 6],
    C: [6, 4, 10, 8, 10, 8, 4, 2, 2, 0],
  };
  const PST = (() => {
    const pst = {};
    for (const kind of Object.keys(VALUES)) {
      const table = [];
      for (let s = 0; s < 90; s++) {
        const r = (s / 9) | 0, c = s % 9;
        const center = 4 - Math.abs(c - 4);
        let v = 0;
        if (kind === "N") v = ROW_BONUS.N[r] + center * 5;
        else if (kind === "R") v = ROW_BONUS.R[r] + center * 2;
        else if (kind === "C") v = ROW_BONUS.C[r] + (c === 4 ? 12 : center * 2);
        else if (kind === "P") {
          if (r === 0) v = 15;
          else if (r <= 4) v = 25 + (4 - r) * 12 + center * 5;
          else v = r === 5 ? 8 : 0;
        } else if (kind === "K") v = r === 9 ? 10 : r === 8 ? 2 : -8;
        table.push(v);
      }
      pst[kind] = table;
    }
    return pst;
  })();
  const MIRROR = Array.from({ length: 90 }, (_, s) => (9 - ((s / 9) | 0)) * 9 + (s % 9));

  function evaluate(pos) {
    let score = 0;
    for (let s = 0; s < 90; s++) {
      const pc = pos.board[s];
      if (pc === ".") continue;
      const kind = pc.toUpperCase();
      if (isRedPiece(pc)) score += VALUES[kind] + PST[kind][s];
      else score -= VALUES[kind] + PST[kind][MIRROR[s]];
    }
    return score;
  }

  class Timeout extends Error {}

  const keyOf = (pos) => pos.board.join("") + pos.sideToMove;

  class Searcher {
    constructor(pos, deadline, history) {
      this.pos = pos;
      this.deadline = deadline;
      this.history = history; // Map key -> 出现次数（对局历史）
      this.path = new Set();  // 当前搜索路径上的局面
      this.tt = new Map();
      this.killers = new Map();
      this.histScore = new Map();
      this.nodes = 0;
    }

    tick() {
      this.nodes += 1;
      if (this.nodes % 2048 === 0 && Date.now() >= this.deadline) throw new Timeout();
    }

    evalStm() {
      const score = evaluate(this.pos);
      return this.pos.sideToMove === RED ? score : -score;
    }

    ordered(moves, ttMove, ply) {
      const board = this.pos.board;
      const killers = this.killers.get(ply) || [];
      const key = (m) => {
        if (m === ttMove) return -1e9;
        const captured = board[mvTo(m)];
        if (captured !== ".") {
          return -(1e6 + VALUES[captured.toUpperCase()] * 10 - VALUES[board[mvFrom(m)].toUpperCase()]);
        }
        if (killers.includes(m)) return -1e5;
        return -(this.histScore.get(m) || 0);
      };
      return moves.map((m) => [key(m), m]).sort((a, b) => a[0] - b[0]).map((p) => p[1]);
    }

    recordQuietCutoff(m, depth, ply) {
      const killers = this.killers.get(ply) || [null, null];
      if (killers[0] !== m) { killers[1] = killers[0]; killers[0] = m; }
      this.killers.set(ply, killers);
      this.histScore.set(m, (this.histScore.get(m) || 0) + depth * depth);
    }

    qsearch(alpha, beta) {
      this.tick();
      const stand = this.evalStm();
      if (stand >= beta) return stand;
      alpha = Math.max(alpha, stand);
      const board = this.pos.board;
      const us = this.pos.sideToMove;
      const captures = this.pos.pseudoMoves().filter((m) => board[mvTo(m)] !== ".");
      for (const m of this.ordered(captures, null, -1)) {
        const undo = this.pos.makeMove(m);
        if (this.pos.inCheck(us)) { this.pos.unmakeMove(undo); continue; }
        let score;
        try {
          score = -this.qsearch(-beta, -alpha);
        } finally {
          this.pos.unmakeMove(undo);
        }
        if (score >= beta) return score;
        alpha = Math.max(alpha, score);
      }
      return alpha;
    }

    negamax(depth, alpha, beta, ply) {
      this.tick();
      const key = keyOf(this.pos);
      if (ply > 0 && (this.path.has(key) || this.history.has(key))) return 0; // 重复局面按和棋

      const entry = this.tt.get(key);
      const ttMove = entry ? entry[3] : null;
      if (entry && entry[0] >= depth) {
        const [, score, flag] = entry;
        if (flag === 0) return score;
        if (flag === 1 && score >= beta) return score;
        if (flag === 2 && score <= alpha) return score;
      }
      if (depth <= 0) return this.qsearch(alpha, beta);

      const us = this.pos.sideToMove;
      let best = -MATE * 2;
      let bestMove = null;
      const originalAlpha = alpha;
      let foundLegal = false;
      this.path.add(key);
      try {
        for (const m of this.ordered(this.pos.pseudoMoves(), ttMove, ply)) {
          const undo = this.pos.makeMove(m);
          if (this.pos.inCheck(us)) { this.pos.unmakeMove(undo); continue; }
          foundLegal = true;
          let score;
          try {
            const ext = ply < 32 && this.pos.inCheck() ? 1 : 0; // 将军延伸
            score = -this.negamax(depth - 1 + ext, -beta, -alpha, ply + 1);
          } finally {
            this.pos.unmakeMove(undo);
          }
          if (score > best) { best = score; bestMove = m; }
          alpha = Math.max(alpha, score);
          if (alpha >= beta) {
            if (this.pos.board[mvTo(m)] === ".") this.recordQuietCutoff(m, depth, ply);
            break;
          }
        }
      } finally {
        this.path.delete(key);
      }

      if (!foundLegal) return -(MATE - ply); // 将死与困毙同为负

      const flag = best >= beta ? 1 : best <= originalAlpha ? 2 : 0;
      this.tt.set(key, [depth, best, flag, bestMove]);
      return best;
    }

    root(depth) {
      const key = keyOf(this.pos);
      const entry = this.tt.get(key);
      const ttMove = entry ? entry[3] : null;
      const us = this.pos.sideToMove;
      let best = -MATE * 2;
      let bestMove = null;
      let alpha = -MATE * 2;
      const beta = MATE * 2;
      this.path.add(key);
      try {
        for (const m of this.ordered(this.pos.pseudoMoves(), ttMove, 0)) {
          const undo = this.pos.makeMove(m);
          if (this.pos.inCheck(us)) { this.pos.unmakeMove(undo); continue; }
          let score;
          try {
            score = -this.negamax(depth - 1, -beta, -alpha, 1);
          } finally {
            this.pos.unmakeMove(undo);
          }
          if (score > best) { best = score; bestMove = m; }
          alpha = Math.max(alpha, score);
        }
      } finally {
        this.path.delete(key);
      }
      this.tt.set(key, [depth, best, 0, bestMove]);
      return [best, bestMove];
    }
  }

  function search(pos, { timeLimit = 2.0, maxDepth = 32, history = null } = {}) {
    const fallback = pos.legalMoves();
    if (fallback.length === 0) return null;
    const hist = history instanceof Map ? history : new Map(Object.entries(history || {}));
    const searcher = new Searcher(pos, Date.now() + timeLimit * 1000, hist);
    let result = null;
    for (let depth = 1; depth <= maxDepth; depth++) {
      let score, move;
      try {
        [score, move] = searcher.root(depth);
      } catch (e) {
        if (e instanceof Timeout) break;
        throw e;
      }
      if (move != null) result = { move, score, depth, nodes: searcher.nodes };
      if (score > MATE - 1000) break;
    }
    return result ?? { move: fallback[0], score: 0, depth: 0, nodes: searcher.nodes };
  }

  return {
    RED, BLACK, START_FEN, Position, perft, evaluate, search, MATE, keyOf,
    toNotation, notationMap, mv, mvFrom, mvTo,
  };
})();
</script>
<script>
"use strict";
(() => {
  const { Position, START_FEN, RED, BLACK } = XQ;
  const CELL = 60, MARGIN = 50, R_PIECE = 26;
  const NS = "http://www.w3.org/2000/svg";
  const HAN = "一二三四五六七八九";
  const CHARS = {
    R: "俥", N: "傌", B: "相", A: "仕", K: "帥", C: "炮", P: "兵",
    r: "車", n: "馬", b: "象", a: "士", k: "將", c: "砲", p: "卒",
  };
  const DIFFICULTY = {
    easy: { timeLimit: 0.2, maxDepth: 2 },
    normal: { timeLimit: 1 },
    strong: { timeLimit: 3 },
  };

  const svg = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const movelistEl = document.getElementById("movelist");
  const toHeadBtn = document.getElementById("tohead");
  const modeSel = document.getElementById("mode");
  const diffSel = document.getElementById("difficulty");

  const state = {
    plies: [],        // {m, notation, fen}
    viewPly: 0,
    mode: "red",
    flip: false,
    selected: null,
    selectedMoves: [],
    thinking: false,
    generation: 0,
    result: null,
  };

  const fenAt = (ply) => (ply === 0 ? START_FEN : state.plies[ply - 1].fen);
  const positionAt = (ply) => Position.fromFen(fenAt(ply));
  const atHead = () => state.viewPly === state.plies.length;
  const humanSide = () => (state.mode === "black" ? BLACK : RED);

  function gameResult() {
    const pos = positionAt(state.plies.length);
    if (pos.legalMoves().length === 0) {
      const winner = pos.sideToMove === BLACK ? "红方胜" : "黑方胜";
      return `${winner} · ${pos.inCheck() ? "将死" : "困毙"}`;
    }
    const counts = new Map();
    for (let p = 0; p <= state.plies.length; p++) {
      const key = fenAt(p).split(" ").slice(0, 2).join(" ");
      counts.set(key, (counts.get(key) ?? 0) + 1);
    }
    const head = fenAt(state.plies.length).split(" ").slice(0, 2).join(" ");
    return counts.get(head) >= 3 ? "和棋 · 三次重复局面" : null;
  }

  // ---- SVG 几何 ----
  const xy = (r, c) => {
    const rr = state.flip ? 9 - r : r;
    const cc = state.flip ? 8 - c : c;
    return [MARGIN + cc * CELL, MARGIN + rr * CELL];
  };
  const el = (tag, attrs = {}, parent = null) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  };

  let gridG, labelsG, overlayG, piecesG;

  function buildBoard() {
    svg.textContent = "";
    const defs = el("defs", {}, svg);
    const grad = el("linearGradient", { id: "wood", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    el("stop", { offset: "0%", "stop-color": "#dcbd90" }, grad);
    el("stop", { offset: "55%", "stop-color": "#d0ac79" }, grad);
    el("stop", { offset: "100%", "stop-color": "#c39a63" }, grad);
    const grain = el("filter", { id: "grain", x: 0, y: 0, width: "100%", height: "100%" }, defs);
    el("feTurbulence", { type: "fractalNoise", baseFrequency: "0.012 0.15", numOctaves: 2, result: "noise" }, grain);
    el("feColorMatrix", { in: "noise", type: "matrix", values: "0 0 0 0 0.35 0 0 0 0 0.22 0 0 0 0 0.08 0 0 0 0.06 0" }, grain);

    el("rect", { x: 0, y: 0, width: 580, height: 640, rx: 10, fill: "url(#wood)", stroke: "#7d5633", "stroke-width": 3 }, svg);
    el("rect", { x: 0, y: 0, width: 580, height: 640, rx: 10, filter: "url(#grain)" }, svg);

    gridG = el("g", { stroke: "#6b4a26", "stroke-width": 1.2, "stroke-linecap": "round" }, svg);
    const X = (c) => MARGIN + c * CELL, Y = (r) => MARGIN + r * CELL;
    el("rect", { x: X(0) - 5, y: Y(0) - 5, width: 8 * CELL + 10, height: 9 * CELL + 10, fill: "none", "stroke-width": 2.2 }, gridG);
    for (let r = 0; r < 10; r++) el("line", { x1: X(0), y1: Y(r), x2: X(8), y2: Y(r) }, gridG);
    for (let c = 0; c < 9; c++) {
      if (c === 0 || c === 8) el("line", { x1: X(c), y1: Y(0), x2: X(c), y2: Y(9) }, gridG);
      else {
        el("line", { x1: X(c), y1: Y(0), x2: X(c), y2: Y(4) }, gridG);
        el("line", { x1: X(c), y1: Y(5), x2: X(c), y2: Y(9) }, gridG);
      }
    }
    for (const [r1, c1, r2, c2] of [[0, 3, 2, 5], [0, 5, 2, 3], [7, 3, 9, 5], [7, 5, 9, 3]]) {
      el("line", { x1: X(c1), y1: Y(r1), x2: X(c2), y2: Y(r2) }, gridG);
    }
    // 炮/兵位刻点
    const tick = (r, c) => {
      const [px, py] = [X(c), Y(r)];
      const g = 4, L = 7;
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if ((c === 0 && sx < 0) || (c === 8 && sx > 0)) continue;
        el("path", {
          d: `M ${px + sx * g} ${py + sy * (g + L)} V ${py + sy * g} H ${px + sx * (g + L)}`,
          fill: "none", "stroke-width": 1.1,
        }, gridG);
      }
    };
    for (const [r, c] of [[2, 1], [2, 7], [7, 1], [7, 7]]) tick(r, c);
    for (const r of [3, 6]) for (const c of [0, 2, 4, 6, 8]) tick(r, c);

    const riverY = Y(4) + CELL / 2;
    el("text", { x: X(2), y: riverY, class: "river-text" }, svg).textContent = "楚 河";
    el("text", { x: X(6), y: riverY, class: "river-text" }, svg).textContent = "漢 界";

    labelsG = el("g", {}, svg);
    overlayG = el("g", {}, svg);
    piecesG = el("g", {}, svg);
    svg.addEventListener("click", (e) => {
      if (e.target === svg || e.target.ownerSVGElement && !e.target.closest(".piece, .dot")) clearSelection();
    });
  }

  function renderLabels() {
    labelsG.textContent = "";
    for (let cc = 0; cc < 9; cc++) {
      const c = state.flip ? 8 - cc : cc;
      const x = MARGIN + cc * CELL;
      const topRed = state.flip;
      const topText = topRed ? HAN[8 - c] : String(c + 1);
      const bottomText = topRed ? String(c + 1) : HAN[8 - c];
      el("text", { x, y: MARGIN - 28, class: "board-label" }, labelsG).textContent = topText;
      el("text", { x, y: MARGIN + 9 * CELL + 36, class: "board-label" }, labelsG).textContent = bottomText;
    }
  }

  // ---- 棋子模型（带身份，便于走子动画）----
  let pieces = [];      // {pc, square, alive, el}
  let squarePiece = []; // square -> piece 索引

  function initPieces() {
    piecesG.textContent = "";
    pieces = [];
    const board = Position.fromFen(START_FEN).board;
    board.forEach((pc, s) => {
      if (pc === ".") return;
      const red = pc === pc.toUpperCase();
      const g = el("g", { class: `piece ${red ? "red" : "black"}` }, piecesG);
      el("circle", { class: "body", r: R_PIECE, fill: "#f8f0dd", stroke: "#b89968", "stroke-width": 1.5 }, g);
      el("circle", { class: "ring", r: R_PIECE - 4.5, fill: "none", stroke: red ? "#a63a2a" : "#2b2620", "stroke-width": 1.2 }, g);
      const t = el("text", { fill: red ? "#a63a2a" : "#2b2620", dy: 1 }, g);
      t.textContent = CHARS[pc];
      const idx = pieces.length;
      g.addEventListener("click", () => onSquare(pieces[idx].square));
      pieces.push({ pc, square: s, alive: true, el: g });
    });
  }

  function layoutPieces() {
    squarePiece = Array(90).fill(null);
    pieces.forEach((p) => { p.alive = true; p.square = null; });
    const board = Position.fromFen(START_FEN).board;
    let i = 0;
    const bySquare = Array(90).fill(null);
    board.forEach((pc, s) => { if (pc !== ".") bySquare[s] = i++; });
    for (let k = 0; k < state.viewPly; k++) {
      const m = state.plies[k].m;
      const frm = XQ.mvFrom(m), to = XQ.mvTo(m);
      if (bySquare[to] !== null) pieces[bySquare[to]].alive = false;
      bySquare[to] = bySquare[frm];
      bySquare[frm] = null;
    }
    bySquare.forEach((idx, s) => { if (idx !== null) { pieces[idx].square = s; squarePiece[s] = idx; } });

    const pos = positionAt(state.viewPly);
    const checkedKing = pos.inCheck() ? pos.board.indexOf(pos.sideToMove === RED ? "K" : "k") : -1;
    pieces.forEach((p) => {
      p.el.classList.toggle("dead", !p.alive);
      if (!p.alive) return;
      const [x, y] = xy((p.square / 9) | 0, p.square % 9);
      p.el.style.transform = `translate(${x}px, ${y}px)`;
      p.el.classList.toggle("selected", p.square === state.selected);
      p.el.classList.toggle("in-check", p.square === checkedKing);
    });
  }

  function renderOverlay() {
    overlayG.textContent = "";
    if (state.viewPly > 0) {
      const m = state.plies[state.viewPly - 1].m;
      for (const s of [XQ.mvFrom(m), XQ.mvTo(m)]) {
        const [x, y] = xy((s / 9) | 0, s % 9);
        el("rect", { x: x - 30, y: y - 30, width: 60, height: 60, rx: 8, class: "lastmove" }, overlayG);
      }
    }
    for (const m of state.selectedMoves) {
      const to = XQ.mvTo(m);
      const [x, y] = xy((to / 9) | 0, to % 9);
      if (squarePiece[to] !== null) {
        el("circle", { cx: x, cy: y, r: R_PIECE + 3.5, class: "capture-ring", "pointer-events": "none" }, overlayG);
      } else {
        const dot = el("circle", { cx: x, cy: y, r: 8, class: "dot" }, overlayG);
        dot.addEventListener("click", () => doMove(m));
      }
    }
  }

  function renderStatus() {
    const side = positionAt(state.viewPly).sideToMove;
    statusEl.classList.toggle("black-turn", side === BLACK);
    statusEl.classList.toggle("over", !!state.result && atHead());
    if (!atHead()) {
      statusEl.textContent = `复盘中 · 第 ${state.viewPly} 手（共 ${state.plies.length} 手）`;
    } else if (state.result) {
      statusEl.textContent = state.result;
    } else if (state.thinking) {
      statusEl.innerHTML = `<span class="spinner"></span>AI 思考中…`;
    } else {
      const pos = positionAt(state.viewPly);
      statusEl.textContent = `轮到${side === RED ? "红方" : "黑方"}${pos.inCheck() ? " · 将军！" : ""}`;
    }
  }

  function renderMovelist() {
    movelistEl.textContent = "";
    if (state.plies.length === 0) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="empty">对局尚未开始</span>`;
      movelistEl.appendChild(li);
    }
    for (let i = 0; i < state.plies.length; i += 2) {
      const li = document.createElement("li");
      const no = document.createElement("span");
      no.className = "no";
      no.textContent = `${i / 2 + 1}.`;
      li.appendChild(no);
      for (const j of [i, i + 1]) {
        const span = document.createElement("span");
        span.className = "ply";
        if (j < state.plies.length) {
          span.textContent = state.plies[j].notation;
          if (j + 1 === state.viewPly) span.classList.add("current");
          span.addEventListener("click", () => { state.selected = null; state.selectedMoves = []; state.viewPly = j + 1; renderAll(); });
        }
        li.appendChild(span);
      }
      movelistEl.appendChild(li);
    }
    movelistEl.scrollTop = atHead() ? movelistEl.scrollHeight : movelistEl.scrollTop;
    toHeadBtn.hidden = atHead();
  }

  function renderAll() {
    state.result = gameResult();
    layoutPieces();
    renderOverlay();
    renderStatus();
    renderMovelist();
  }

  // ---- 交互 ----
  function clearSelection() {
    if (state.selected === null) return;
    state.selected = null;
    state.selectedMoves = [];
    layoutPieces();
    renderOverlay();
  }

  function snapToHead() {
    state.viewPly = state.plies.length;
    state.selected = null;
    state.selectedMoves = [];
    renderAll();
  }

  function onSquare(s) {
    if (state.thinking) return;
    if (!atHead()) { snapToHead(); return; }
    if (state.result) return;
    const pos = positionAt(state.viewPly);
    if (state.mode !== "both" && pos.sideToMove !== humanSide()) return;
    const pc = pos.board[s];
    const mine = pc !== "." && (pc === pc.toUpperCase()) === (pos.sideToMove === RED);
    if (state.selected !== null) {
      const m = state.selectedMoves.find((m2) => XQ.mvTo(m2) === s);
      if (m) { doMove(m); return; }
    }
    if (mine) {
      state.selected = s;
      state.selectedMoves = pos.legalMoves().filter((m) => XQ.mvFrom(m) === s);
    } else {
      state.selected = null;
      state.selectedMoves = [];
    }
    layoutPieces();
    renderOverlay();
  }

  function doMove(m) {
    const pos = positionAt(state.plies.length);
    const notation = XQ.toNotation(pos, m);
    pos.makeMove(m);
    if (!atHead()) state.plies.length = state.viewPly; // 从历史分支出新变化
    state.plies.push({ m, notation, fen: pos.toFen() });
    state.viewPly = state.plies.length;
    state.selected = null;
    state.selectedMoves = [];
    renderAll();
    maybeAI();
  }

  // ---- AI（Web Worker，失败时回退主线程）----
  let worker = null, workerBroken = false;

  function ensureWorker() {
    if (worker || workerBroken) return worker;
    try {
      const src = document.getElementById("engine").textContent +
        "\nonmessage = (e) => {" +
        " const { fen, options, gen } = e.data;" +
        " const r = XQ.search(XQ.Position.fromFen(fen), options);" +
        " postMessage({ gen, move: r && r.move });" +
        "};";
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      worker.onmessage = (e) => onAIResult(e.data.gen, e.data.move);
      worker.onerror = () => { workerBroken = true; worker = null; };
    } catch {
      workerBroken = true;
    }
    return worker;
  }

  function onAIResult(gen, m) {
    if (gen !== state.generation) return;
    state.thinking = false;
    if (m != null) doMove(m);
    else renderAll();
  }

  function maybeAI() {
    if (state.result || state.mode === "both" || !atHead()) return;
    const pos = positionAt(state.plies.length);
    const aiSide = state.mode === "red" ? BLACK : RED;
    if (pos.sideToMove !== aiSide) return;
    state.thinking = true;
    renderStatus();
    const gen = state.generation;
    const history = {};
    for (let p = 0; p <= state.plies.length; p++) {
      const key = XQ.keyOf(Position.fromFen(fenAt(p)));
      history[key] = (history[key] || 0) + 1;
    }
    const options = { ...DIFFICULTY[diffSel.value], history };
    const w = ensureWorker();
    if (w) {
      w.postMessage({ fen: pos.toFen(), options, gen });
    } else {
      setTimeout(() => {
        const r = XQ.search(pos, options);
        onAIResult(gen, r && r.move);
      }, 30);
    }
  }

  function undo() {
    if (state.plies.length === 0 && !state.thinking) return;
    state.generation += 1; // 作废进行中的思考
    state.thinking = false;
    if (state.plies.length > 0) {
      state.plies.pop();
      if (state.mode !== "both") {
        while (state.plies.length > 0 && positionAt(state.plies.length).sideToMove !== humanSide()) {
          state.plies.pop();
        }
      }
    }
    snapToHead();
    maybeAI();
  }

  function newGame() {
    state.generation += 1;
    state.thinking = false;
    state.plies = [];
    state.viewPly = 0;
    state.selected = null;
    state.selectedMoves = [];
    state.mode = modeSel.value;
    state.flip = state.mode === "black";
    renderLabels();
    initPieces();
    renderAll();
    maybeAI();
  }

  document.getElementById("new").addEventListener("click", newGame);
  document.getElementById("undo").addEventListener("click", undo);
  toHeadBtn.addEventListener("click", snapToHead);
  modeSel.addEventListener("change", newGame);

  buildBoard();
  newGame();
})();
</script>
</body>
</html>
